apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/bu3lii/cicd-go-k8s.git
    targetRevision: main
    path: helm/go-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
